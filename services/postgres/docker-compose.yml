services:
  postgres:
    image: ${IMAGE}
    restart: unless-stopped
    command: >
      postgres -c shared_buffers=2GB -c effective_cache_size=6GB -c max_wal_size=4GB -c random_page_cost=1.1

    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      # "disable" (default) preserves today's behavior. Any other libpq
      # sslmode value (e.g. "require") makes the init script generate a
      # self-signed cert and turn SSL on — see init/00-ssl.sh.
      SSLMODE: "${SSLMODE:-disable}"
    volumes:
      # Default to a named Docker volume for local use; set PGDATA_VOLUME to an
      # absolute host path (e.g. /mnt/nvme/pgdata) to use a bind mount instead.
      - ${PGDATA_VOLUME:-pgdata}:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    network_mode: "${NETWORK_MODE:-bridge}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${PG_PASSWORD} psql -U ${PG_USER} -d ${PG_USER} -c 'SELECT 1' > /dev/null 2>&1"]
      # we need the healthcheck only once during startup. Make this interval long enough to avoid perturbation during the benchmark
      interval: 12h
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  pgdata:
