name: E2E Tests

on:
  pull_request:
    branches: [main]
  # Runs on main seed the shared Go cache: a cache written during a pull_request run is
  # scoped to that PR and unreadable by any other, so without this every PR starts cold.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main runs finish so they always seed the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHCTL_STORE_MODE: local
      BENCHCTL_USERNAME: ${{ github.repository }}:${{ github.workflow }}:${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-setup

      # Started without waiting so VictoriaMetrics boots while Go compiles; the health
      # gate below runs just before the first step that actually needs it.
      - name: Start observability stack
        run: mise run observability-up-metrics

      - name: Install go-tpc
        run: mise run install-go-tpc

      - name: Build benchctl
        run: mise build

      - name: Wait for VictoriaMetrics
        run: until curl -sf http://127.0.0.1:8428/health; do sleep 1; done

      - name: Run local scenario
        run: |
          ./benchctl run scenarios/postgres-tpcc-local.yaml \
            --set warehouses=1 \
            --set client_threads=2 \
            --set duration=15s \
            --set collector=victoriametrics
        env:
          BENCHCTL_METRICS_ENDPOINT: http://127.0.0.1:8428

      - name: Verify run state
        run: ./benchctl status --all

      - name: Verify results
        run: |
          RUN_ID=$(./benchctl status -a | awk 'NR==2 {print $1}')
          # Poll until VM makes the samples queryable (-search.latencyOffset, set to 1s
          # in deployments/local/observability.yml). Try first, then sleep.
          for i in {1..30}; do
            OUTPUT=$(./benchctl results "$RUN_ID" 2>&1) && break
            echo "Attempt $i: metrics not yet available, retrying..."
            sleep 2
          done
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "service:"
          echo "$OUTPUT" | grep -q "pg_version:"
          echo "$OUTPUT" | grep -q "NEW_ORDER"
        env:
          BENCHCTL_METRICS_ENDPOINT: http://127.0.0.1:8428
