name: Integration Tests

on:
  pull_request:
    branches: [main]
  # Runs on main seed the shared Go cache: a cache written during a pull_request run is
  # scoped to that PR and unreadable by any other, so without this every PR starts cold.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main runs finish so they always seed the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-setup

      - name: Start observability stack
        run: |
          mise run observability-up
          until curl -sf http://127.0.0.1:8428/health; do sleep 1; done

      - name: Stage embed
        run: mise run stage-embed

      - name: Run integration tests
        run: go test -tags integration ./...

      - name: Stop observability stack
        if: always()
        run: mise run observability-reset
