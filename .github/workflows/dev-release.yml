name: Dev Release

on:
  push:
    branches: [main]

# Prevent races when multiple PRs merge in quick succession: only the latest run
# updates the rolling dev release; any in-progress run for an older commit is cancelled.
concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Do not restore the mise cache in a job that publishes a release. Release jobs can
      # read caches written on main, so a cache poisoned by any workflow that can write
      # there would end up in the published binaries.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false

      - name: Compute version
        id: version
        run: echo "version=$(mise run version 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: mise run build-all

      - name: Compute checksums
        run: |
          cd bin
          sha256sum benchctl-linux-amd64 benchctl-linux-arm64 benchctl-darwin-amd64 benchctl-darwin-arm64 > checksums.txt

      - name: Update dev release
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev \
            --prerelease \
            --title "dev (${{ steps.version.outputs.version }})" \
            --notes "Development build: \`${{ steps.version.outputs.version }}\`" \
            bin/benchctl-linux-amd64 \
            bin/benchctl-linux-arm64 \
            bin/benchctl-darwin-amd64 \
            bin/benchctl-darwin-arm64 \
            bin/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
