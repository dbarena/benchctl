name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Do not restore the mise cache in a job that publishes a release. Release jobs can
      # read caches written on main, so a cache poisoned by any workflow that can write
      # there would end up in the published binaries.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Build binaries
        run: mise run build-all
        env:
          BENCHCTL_RELEASE_VERSION: ${{ github.ref_name }}
          BENCHCTL_BUILD_KIND: release

      - name: Compute checksums
        run: |
          cd bin
          sha256sum benchctl-linux-amd64 benchctl-linux-arm64 benchctl-darwin-amd64 benchctl-darwin-arm64 > checksums.txt

      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "benchctl ${{ github.ref_name }}" \
            bin/benchctl-linux-amd64 \
            bin/benchctl-linux-arm64 \
            bin/benchctl-darwin-amd64 \
            bin/benchctl-darwin-arm64 \
            bin/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
