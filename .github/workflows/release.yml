name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Build binaries
        run: mise run build-all
        env:
          BENCHCTL_RELEASE_VERSION: ${{ github.ref_name }}
          BENCHCTL_BUILD_KIND: release

      - name: Compute checksums
        run: |
          cd bin
          sha256sum benchctl-linux-amd64 benchctl-linux-arm64 benchctl-darwin-amd64 benchctl-darwin-arm64 > checksums.txt

      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "benchctl ${{ github.ref_name }}" \
            bin/benchctl-linux-amd64 \
            bin/benchctl-linux-arm64 \
            bin/benchctl-darwin-amd64 \
            bin/benchctl-darwin-arm64 \
            bin/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
