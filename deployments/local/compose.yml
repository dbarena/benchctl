name: benchctl-observability

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.141.0
    ports:
      - "8428:8428"
    command:
      - -retentionPeriod=12
      - -storageDataPath=/storage
      # Data is hidden from queries for this long after collection (default 30s), which
      # is what "benchctl results" spends waiting right after a run. Benchmark samples
      # are all pushed at once when the run ends, so there is no partial-data risk here.
      - -search.latencyOffset=1s
    volumes:
      - vm-data:/storage

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics

volumes:
  vm-data:
