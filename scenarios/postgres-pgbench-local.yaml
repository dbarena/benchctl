# postgres-pgbench-local.yaml — Postgres pgbench, local docker-compose
apiVersion: bench/v1
kind: Scenario
metadata:
  name: postgres-pgbench-local
  labels:
    engine: postgres
    workload: pgbench
    platform: local
inputs:
  scale:
    type: int
    default: 1
    description: pgbench scale factor (100,000 pgbench_accounts rows per unit)
  clients:
    type: int
    default: 2
    description: Number of concurrent pgbench clients
  duration_seconds:
    type: int
    default: 60
    description: Duration of each measured run, in seconds
  builtin:
    type: string
    default: "select-only"
    description: 'pgbench built-in script for the builtin step: tpcb-like, simple-update or select-only'
  script:
    type: string
    default: "SELECT 1;"
    description: Text of the custom script for the custom-script step
  postgres_docker_image:
    type: string
    default: "postgres:17"
    description: Docker image for the Postgres service
  collector:
    type: string
    default: stdout
    description: Collector provider to emit results to
  effective_date:
    type: string
    default: ""
    description: 'Metric timestamp override: "auto" (today, UTC midnight), "YYYYMMDD" (backfill), or empty for now'
  file_enabled:
    type: bool
    default: false
    description: Whether to write a results file to disk
  db_user:
    type: string
    default: "bench"
    description: Postgres user name for the docker-compose service
  db_password:
    type: string
    default: "bench"
    description: Postgres password for the docker-compose service
target:
  provider: docker-compose
  config:
    services:
      - name: postgres
        definition: ./services/postgres/docker-compose.yml
        vars:
          image: "{{ inputs.postgres_docker_image }}"
          user: "{{ inputs.db_user }}"
          password: "{{ inputs.db_password }}"
          db: tpcc
suite:
  benchmarks:
    - name: postgres
      using: postgres
      steps:
        - name: get-pg-version
          type: metadata
          command: sql
          args:
            name: pg_version
            query: "SELECT version()"
        # Create and load the standard pgbench tables.
        - name: init
          type: pgbench
          command: init
          args:
            scale: "{{ inputs.scale }}"
        - name: pre-benchmark-checkpoint
          type: sql
          args:
            query: "CHECKPOINT"
        # One of pgbench's built-in scripts.
        - name: builtin
          type: pgbench
          command: run
          args:
            builtin: "{{ inputs.builtin }}"
            client: "{{ inputs.clients }}"
            jobs: "{{ inputs.clients }}"
            time: "{{ inputs.duration_seconds }}"
            protocol: prepared
            no-vacuum: ""
        # A custom script, given inline. --scale sets :scale for the script,
        # as it does for the built-in ones.
        - name: custom-script
          type: pgbench
          command: run
          args:
            script: "{{ inputs.script }}"
            scale: "{{ inputs.scale }}"
            client: "{{ inputs.clients }}"
            jobs: "{{ inputs.clients }}"
            time: "{{ inputs.duration_seconds }}"
            protocol: prepared
            no-vacuum: ""
driver:
  provider: local
collector:
  provider: "{{ inputs.collector }}"
  config:
    effective_date: "{{ inputs.effective_date }}"
    file_enabled: "{{ inputs.file_enabled }}"
